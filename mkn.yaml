#! clean build test -p test_plamn_core -dKO -t 8

name: plamn

profile:

# subprojects are fetched along the profile/parent chain, before sources are checked
- name: base
  inc: inc
       tpp/cppdict/include
       tpp/menum/include
  sub: cppdict&tpp/cppdict(https://github.com/LaboratoryOfPlasmaPhysics/cppdict)
       menum&tpp/menum(https://github.com/Neargye/magic_enum)
  self: damn
  arg: -std=c++20

# python module: pyphare's dict and enums, installed into python/pyplamn
- name: py_etc
  parent: base
  dep: lang.nanobind
  mod: lang.python3 python3.module
  src: src/python3/plamn_etc.cpp
  mode: shared
  out: plamn_etc
  install: python/pyplamn

# python module: a simulator permutation (1D, interp 1, AoSMapped, CPU)
- name: py_sim
  parent: base
  dep: lang.nanobind
  mod: lang.python3 python3.module
  src: src/python3/plamn_sim.cpp
  mode: shared
  out: plamn_cpp_1_1_2_AoSMapped_CPU
  install: python/pyplamn

- name: test_plamn_core
  inc: . tpp/damn
  self: base
  dep: google.test
  mode: none
  test: tst/plamn/core/data/grid/test_layout.cpp
        tst/plamn/core/numerics/particles_synchronised_mover/test_updater.cpp
        tst/plamn/core/numerics/particles_synchronised_mover/test_multi_updater.cpp
        tst/plamn/core/numerics/faraday/test_tileset_faraday.cpp
        tst/plamn/core/numerics/ampere/test_tileset_ampere.cpp
        tst/plamn/core/numerics/ohm/test_tileset_ohm.cpp

- name: test_plamn_core_slow # ~17M particles, >10 min unoptimised
  parent: test_plamn_core
  test: tst/plamn/core/data/particles/test_particles_partitioning.cpp

# tpp/damn may be a symlink to a local damn checkout, otherwise it is cloned
- name: damn
  dep: damn&tpp/damn(https://github.com/PhilipDeegan/damn)[damn_core]

# include-what-you-use report for inc/, needs iwyu on PATH
- name: iwyu
  parent: base
  mode: none
  mod:
  - name: cpp.iwyu
    compile:
      paths: inc
      headers: -x c++-header
      # namespace a::b in forward declarations, plamn's include mappings
      args: -Xiwyu --cxx17ns -Xiwyu --mapping_file=res/iwyu.imp

# iwyu's suggestions applied (fix_include): CI builds this and fails on any resulting diff
# mpicxx adds MPI's include directories itself, iwyu needs them given (Debian/Ubuntu openmpi)
- name: iwyu_fix
  parent: base
  mode: none
  mod:
  - name: cpp.iwyu
    compile:
      paths: inc
      # fragments (of particles_sorting.hpp, particles_partitioning.hpp), and backends needing
      # RAJA / Kokkos
      ignore: sorting/particles_sorting_cpu.hpp partitioning/particles_partitioning_cpu.hpp
              grid/detail/raja.hpp grid/detail/kokkos.hpp
      inc: /usr/lib/x86_64-linux-gnu/openmpi/include /usr/lib/x86_64-linux-gnu/openmpi/include/openmpi
      headers: -x c++-header
      # namespace a::b in forward declarations, plamn's include mappings
      args: -Xiwyu --cxx17ns -Xiwyu --mapping_file=res/iwyu.imp
      fix: --nocomments --noreorder --nosafe_headers # keeps the include order: damn, plamn, other, system
      system_last: true
