name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request: # not drafts (each job's if): a draft's pushes cost no Actions minutes, being
    #  marked ready for review runs everything once; test locally meanwhile
    types: [opened, synchronize, reopened, ready_for_review]

# the C++ tests beside the python ones (a job per pyphare), in parallel; each python job builds
#  its own modules: mkn's -O builds for the build machine (-march=native), so modules built on
#  one runner can hold instructions another runner's CPU lacks (Illegal instruction)
jobs:
  core:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:26.04
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        damn-key: ${{ secrets.DAMN_DEPLOY_KEY }}
        mkn: "true"
    - run: >-
        KLOG=3 mkn clean build test -dKOqp test_plamn_core -t 4 -x res/mkn/mpi
        -W 9 -a "-Wno-unused-parameter -Wno-unused-variable -Wno-error=strict-aliasing"

  # plamn runs pyphare's python against plamn's modules: pyphare from PhilipDeegan/PHARE's wrangler
  #  (PHARE master and the live DataWrangler's python accessors, which master lacks yet)
  python:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        pyphare: [wrangler]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        damn-key: ${{ secrets.DAMN_DEPLOY_KEY }}
        mkn: "true"
    # the python modules, with the same settings as above (C++20, also for mkn's own modules)
    - run: >-
        KLOG=3 ./mkn.py --dim 1 2 --jobs 4 -- -q -x res/mkn/mpi
        -W 9 -a "-Wno-unused-parameter -Wno-unused-variable -Wno-error=strict-aliasing"
    - run: >-
        KLOG=3 ./mkn.py --mhd --no-etc --jobs 4 --hall false true -- -q -x res/mkn/mpi
        -W 9 -a "-Wno-unused-parameter -Wno-unused-variable -Wno-error=strict-aliasing"
    # MHD under hybrid levels (test_coupled)
    - run: >-
        KLOG=3 ./mkn.py --coupled --no-etc --dim 1 --jobs 4 -- -q -x res/mkn/mpi
        -W 9 -a "-Wno-unused-parameter -Wno-unused-variable -Wno-error=strict-aliasing"
    # the chunked layouts (test_restarts' chunked cases)
    - run: >-
        KLOG=3 ./mkn.py --no-etc --dim 1 --layout SoAVXChunked AoS4SoAVXChunked --jobs 4 -- -q
        -x res/mkn/mpi -W 9 -a "-Wno-unused-parameter -Wno-unused-variable -Wno-error=strict-aliasing"
    - uses: actions/checkout@v4
      with:
        repository: PhilipDeegan/PHARE
        ref: ${{ matrix.pyphare }}
        path: phare
        sparse-checkout: pyphare
    - run: |
        PYTHONPATH=.:phare/pyphare:tst/plamn/python \
          python3 -m phlop.run.test_cases -i tst -c 4 --tags mpi
    # a failing test's output, kept by phlop under .phlop/ (a hidden directory: include-hidden-files)
    - if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: phlop-logs-${{ matrix.pyphare }}
        path: .phlop/
        include-hidden-files: true
        if-no-files-found: ignore

  # test_layouts in 2D and 3D, a runner per dimension (the python job above has 1D's modules):
  #  AoSMapped, the reference, and the other CPU layouts
  layouts:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        dim: [2, 3]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        damn-key: ${{ secrets.DAMN_DEPLOY_KEY }}
        mkn: "true"
    - run: >-
        KLOG=3 ./mkn.py --dim ${{ matrix.dim }} --layout AoSMapped AoSCMTS SoAVXChunked
        AoS4SoAVXChunked --jobs 4 -- -q -x res/mkn/mpi
        -W 9 -a "-Wno-unused-parameter -Wno-unused-variable -Wno-error=strict-aliasing"
    - uses: actions/checkout@v4
      with:
        repository: PhilipDeegan/PHARE
        ref: wrangler
        path: phare
        sparse-checkout: pyphare
    - run: |
        PYTHONPATH=.:phare/pyphare:tst/plamn/python \
          python3 -m unittest -v tst.plamn.python.test_layouts.Layouts${{ matrix.dim }}dTest
