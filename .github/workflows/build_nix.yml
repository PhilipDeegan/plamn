name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:24.04

    steps:
    - uses: actions/checkout@v4

    - run: |
        apt update && apt install -y curl git openssh-client

    # damn is private: check it out where mkn looks for it (tpp/damn) instead of cloning,
    # using a read-only deploy key on damn
    - uses: actions/checkout@v4
      with:
        repository: PhilipDeegan/damn
        ssh-key: ${{ secrets.DAMN_DEPLOY_KEY }}
        path: tpp/damn

    - run: |
        curl -Lo mkn https://github.com/mkn/mkn/releases/download/latest/mkn_nix
        chmod +x mkn
        KLOG=3 ./mkn clean build test -dtKOqp test_plamn_core -Wx res/mkn/mpi

    # pyplamn runs pyphare's python against plamn's modules: pyphare from a PHARE checkout
    - uses: actions/checkout@v4
      with:
        repository: PhilipDeegan/PHARE
        ref: tiling_gpu
        path: phare
        sparse-checkout: pyphare

    # the python modules without MPI: the tests run serially, without MPI_Init
    - run: |
        KLOG=3 ./mkn build -dtKOqp py_etc -x res/mkn/base
        KLOG=3 ./mkn build -dtKOqp py_sim -x res/mkn/base
        PYTHONPATH=python:phare/pyphare:tst/plamn/python \
          python3 -m unittest discover -v -s tst/plamn/python
