name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request: # not drafts (each job's if): a draft's pushes cost no Actions minutes, being
    #  marked ready for review runs everything once; test locally meanwhile
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:26.04

    steps:
    - uses: actions/checkout@v4

    - run: apt update && apt install -y curl git openssh-client

    # the image has PHARE's requirements.txt (numpy, dill, matplotlib, ...) in a venv only
    # ~/.bashrc activates, which run steps don't source: put it first on PATH for later steps
    - run: |
        for venv in /.venv /root/.venv; do
          if [ -x $venv/bin/python3 ]; then echo "$venv/bin" >> $GITHUB_PATH; break; fi
        done
    - run: python3 -c "import dill, numpy, matplotlib; print('pyphare requirements from', __import__('sys').prefix)"
    # phlop.run.test_cases: one process per test, in parallel; tst/plamn/python/.phlop.exec.yaml:
    #  --tags mpi also runs the simulator tests on 3 ranks (mpirun)
    - run: python3 -m pip install phlop

    # damn is private: check it out where mkn looks for it (tpp/damn) instead of cloning,
    # using a read-only deploy key on damn
    - uses: actions/checkout@v4
      with:
        repository: PhilipDeegan/damn
        ssh-key: ${{ secrets.DAMN_DEPLOY_KEY }}
        path: tpp/damn
    - name: damn's branch of the same name (a plamn PR that needs a damn PR), else the PR's base (next)
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
        BASE: ${{ github.base_ref }}
      run: |
        cd tpp/damn && git config --global --add safe.directory "$PWD"
        for b in "$BRANCH" "$BASE"; do
          if [ -n "$b" ] && [ "$b" != master ] && git ls-remote --exit-code --heads origin "$b" >/dev/null; then
            git fetch -q --depth 1 origin "$b" && git checkout -q FETCH_HEAD && break
          fi
        done
        echo "damn: $(git log --oneline -1)"

    - run: |
        curl -Lo mkn https://github.com/mkn/mkn/releases/download/latest/mkn_nix
        chmod +x mkn
        KLOG=3 ./mkn clean build test -dtKOqp test_plamn_core -Wx res/mkn/mpi

    # pyplamn runs pyphare's python against plamn's modules: pyphare from a PHARE checkout
    - uses: actions/checkout@v4
      with:
        repository: PhilipDeegan/PHARE
        ref: tiling_gpu
        path: phare
        sparse-checkout: pyphare

    # the python modules, with the same settings as above (C++20, also for mkn's own modules);
    # the tests run serially, without MPI_Init
    - run: |
        PATH=$PWD:$PATH KLOG=3 ./mkn.py --dim 1 2 -- -qW -x res/mkn/mpi
        PYTHONPATH=python:phare/pyphare:tst/plamn/python \
          python3 -m phlop.run.test_cases -i tst -c 4 --tags mpi

    # again with the pyphare of PHAREHUB/PHARE#1171 (live DataWrangler, PHARE master based)
    - uses: actions/checkout@v4
      with:
        repository: PhilipDeegan/PHARE
        ref: wrangler
        path: phare_wrangler
        sparse-checkout: pyphare

    - run: |
        PYTHONPATH=python:phare_wrangler/pyphare:tst/plamn/python \
          python3 -m phlop.run.test_cases -i tst -c 4 --tags mpi
