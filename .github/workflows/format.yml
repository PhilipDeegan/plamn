name: format

# changed C++ lines follow .clang-format, as PHARE's gate (one clang-format version for
# everyone: results differ between versions)

on:
  pull_request: # not drafts (each job's if): a draft's pushes cost no Actions minutes, being
    #  marked ready for review runs everything once; test locally meanwhile
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - run: python -m pip install clang-format==22.1.8

    # exit 0: nothing to change, 1: a diff, other: an error
    - run: |
        mb=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
        rc=0
        git clang-format --diff --extensions c,cc,cpp,h,hpp,ipp "$mb" -- inc src tst \
          > format.diff || rc=$?
        [ "$rc" -le 1 ] || { cat format.diff; exit "$rc"; }
        if grep -q '^diff --git' format.diff; then
          cat format.diff
          echo "run: git clang-format $mb -- inc src tst"
          exit 1
        fi

  iwyu:
    if: ${{ !github.event.pull_request.draft }}
    # include what you use: applying iwyu's suggestions changes nothing
    # Debian 13: the same iwyu (8.23) and libstdc++ as development machines, results differ
    # between versions; also a much smaller image than phare_dep
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 30
    steps:
    - run: |  # git before checkout, so the checkout is a repository
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git openssh-client \
          g++ openmpi-bin libopenmpi-dev iwyu

    - uses: actions/checkout@v4

    # damn is private: check it out where mkn looks for it (tpp/damn), as build_nix.yml
    - uses: actions/checkout@v4
      with:
        repository: PhilipDeegan/damn
        ssh-key: ${{ secrets.DAMN_DEPLOY_KEY }}
        path: tpp/damn
    - name: damn's branch of the same name (a plamn PR that needs a damn PR), else the PR's base (next)
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
        BASE: ${{ github.base_ref }}
      run: |
        cd tpp/damn && git config --global --add safe.directory "$PWD"
        for b in "$BRANCH" "$BASE"; do
          if [ -n "$b" ] && [ "$b" != master ] && git ls-remote --exit-code --heads origin "$b" >/dev/null; then
            git fetch -q --depth 1 origin "$b" && git checkout -q FETCH_HEAD && break
          fi
        done
        echo "damn: $(git log --oneline -1)"

    - run: |
        curl -Lo mkn https://github.com/mkn/mkn/releases/download/latest/mkn_nix
        chmod +x mkn
        KLOG=3 ./mkn build -dtKOqp iwyu_fix -Wx res/mkn/mpi # build: the module must link
        git config --global --add safe.directory "$PWD"
        if ! git diff --exit-code -- inc src tst; then
          echo "run: mkn build -p iwyu_fix -x res/mkn/mpi, and commit the result"
          exit 1
        fi

  clang-tidy:
    if: ${{ !github.event.pull_request.draft }}
    # .clang-tidy's checks on the changed C++ lines, as PHARE's gate: clang-tidy reads the real
    # compile commands, from an mkn dry run (res/ci/compile_db.py: no build). Findings show inline
    # on the PR (annotations). Warning only for now.
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 20
    steps:
    # Debian 13's clang-tidy 22, the same as development machines (results differ between versions)
    - run: |  # git before checkout, so the checkout is a repository
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git openssh-client g++ python3 \
          clang-tidy-22 openmpi-bin libopenmpi-dev # mpicxx: the python modules' flags
        clang-tidy-22 --version

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # damn is private: check it out where mkn looks for it (tpp/damn), as build_nix.yml
    - uses: actions/checkout@v4
      with:
        repository: PhilipDeegan/damn
        ssh-key: ${{ secrets.DAMN_DEPLOY_KEY }}
        path: tpp/damn
    - name: damn's branch of the same name (a plamn PR that needs a damn PR), else the PR's base (next)
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
        BASE: ${{ github.base_ref }}
      run: |
        cd tpp/damn && git config --global --add safe.directory "$PWD"
        for b in "$BRANCH" "$BASE"; do
          if [ -n "$b" ] && [ "$b" != master ] && git ls-remote --exit-code --heads origin "$b" >/dev/null; then
            git fetch -q --depth 1 origin "$b" && git checkout -q FETCH_HEAD && break
          fi
        done
        echo "damn: $(git log --oneline -1)"

    - name: compile commands
      run: |
        git config --global --add safe.directory "$PWD"
        curl -Lo mkn https://github.com/mkn/mkn/releases/download/latest/mkn_nix
        chmod +x mkn && mv mkn /usr/local/bin/mkn
        python3 res/ci/compile_db.py test_plamn_core,py_etc,py_sim -dKO -x res/mkn/mpi

    - continue-on-error: true # warning only (step level: the job stays green)
      run: |
        mb=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
        git diff -U0 "$mb" HEAD -- inc src tst \
          | clang-tidy-diff-22.py -clang-tidy-binary clang-tidy-22 -p1 -path . -j "$(nproc)" \
                                  -quiet -iregex '.*\.(c|cc|cpp|h|hpp|ipp)' > tidy.log 2>&1 || true
        python3 res/ci/tidy_annotations.py tidy.log "$PWD"
        ! grep -qE ": (warning|error): .*\[" tidy.log # the step fails (yellow) on findings
