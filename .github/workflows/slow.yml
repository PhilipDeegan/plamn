name: Slow

# tests too long for every pull request: on merges to master and on demand, as gpu.yml
#   test_plamn_core_slow   particle partitioning over ~17M particles (>10 min unoptimised)
#   phare                  the PHARE reference (see its checkout) and plamn on the same long
#                          runs: how far they differ
# damn is private: checked out where mkn looks for it (tpp/damn) with a read-only deploy key

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request: # changes to this workflow are tried before they merge
    paths: [.github/workflows/slow.yml]

permissions:
  contents: read

env:
  CURL_GET: curl -fL --retry 3 --retry-delay 2
  PATH_GET: https://github.com/mkn/mkn/releases/latest/download

jobs:
  slow:
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:26.04
    timeout-minutes: 240

    steps:
    - uses: actions/checkout@v4

    - run: apt update && apt install -y curl git openssh-client

    - uses: actions/checkout@v4
      with:
        repository: PhilipDeegan/damn
        ssh-key: ${{ secrets.DAMN_DEPLOY_KEY }}
        path: tpp/damn
    - name: damn's branch of the same name (a plamn PR that needs a damn PR), else the PR's base (next)
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
        BASE: ${{ github.base_ref }}
      run: |
        cd tpp/damn && git config --global --add safe.directory "$PWD"
        for b in "$BRANCH" "$BASE"; do
          if [ -n "$b" ] && [ "$b" != master ] && git ls-remote --exit-code --heads origin "$b" >/dev/null; then
            git fetch -q --depth 1 origin "$b" && git checkout -q FETCH_HEAD && break
          fi
        done
        echo "damn: $(git log --oneline -1)"

    - name: test_plamn_core_slow
      run: |
        $CURL_GET -o mkn $PATH_GET/mkn_nix
        chmod +x mkn
        KLOG=3 ./mkn clean build test -dKOqp test_plamn_core_slow -W 9 -a "-Wno-unused-parameter -Wno-unused-variable -Wno-error=strict-aliasing" -x res/mkn/mpi -t 4

  # PHARE master's 1D modules (and a 3D hybrid one) built as its CI builds them (cmake_ubuntu.yml: SAMRAI from the
  #  image, double precision diagnostics), plamn's the same way, then the same input under both
  #  (etc/compare/phare): the ion beam, 2 levels, 2000 steps, B and E compared every 100 steps;
  #  then the MHD shocks (PHARE's tests/functional/mhd_shock: periodic, 400 steps; between an
  #  inflow and an open boundary, 1000 steps), and PHARE's test_advance_mhd input on 2 levels
  #  (a refinement box: level ghosts, reflux; tagged: regrids): MHD only, B rho V P at every
  #  dump; a 3D harris (10^3 cells, 100 ppc, tagged levels; 80^3 cells, level 0 only) sized
  #  for a runner by its memory
  #  (cases.py tiers; each run's peak memory per rank in compare/**/*.mem.json). Partitioned
  #  for the wall time: each module built on its own runner (plamn's and
  #  PHARE's at once), then each comparison on its own runner with every module
  plamn_modules:
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: # name: the artifact's; args: ./mkn.py's (the hybrid one builds plamn_etc too)
        - { name: hybrid, args: "--dim 1" }
        - { name: hybrid3d, args: "--dim 3 --no-etc" }
        # tiled layouts, compared against the same PHARE references (phare: layout rows)
        - { name: hybrid_aoscmts, args: "--dim 1 --no-etc --layout AoSCMTS" }
        - { name: hybrid3d_aoscmts, args: "--dim 3 --no-etc --layout AoSCMTS" }
        - { name: mhd, args: "--mhd --no-etc" }
        - { name: wenoz, args: "--mhd --no-etc --reconstruction WENOZ --limiter None" }
        - { name: hll, args: "--mhd --no-etc --riemann HLL" }
        - { name: hlld, args: "--mhd --no-etc --riemann HLLD" }
        - { name: hall, args: "--mhd --no-etc --hall true" }

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        damn-key: ${{ secrets.DAMN_DEPLOY_KEY }}
        mkn: "true"
    # --optimise 3: no -march=native (built on one runner, run on another: SIGILL otherwise)
    # -g 0: NDEBUG, no DAMN_DEBUG checks (drop it here to compare a debug build)
    - run: KLOG=3 ./mkn.py ${{ matrix.args }} --jobs 4 --optimise 3 --diag-doubles -- -q -g 0 -x res/mkn/mpi
    - uses: actions/upload-artifact@v4
      with:
        name: plamn-${{ matrix.name }}
        path: plamn/*.so
        if-no-files-found: error

  phare_modules:
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [cpp_1_1_2, cpp_1_Linear_VanLeer_Rusanov_false, cpp_1_WENOZ_None_Rusanov_false,
                 cpp_1_Linear_VanLeer_HLL_false, cpp_1_Linear_VanLeer_HLLD_false,
                 cpp_1_Linear_VanLeer_Rusanov_true, cpp_3_1_6]

    steps:
    - uses: actions/checkout@v4 # this file only: its hash keys the module cache (build flags)
      with:
        sparse-checkout: .github/workflows/slow.yml
        sparse-checkout-cone-mode: false
    - uses: actions/checkout@v4
      with: # the reference while Ohm's energy fix is unmerged upstream: back to PHAREHUB/PHARE
        #  master when it is
        repository: nicolasaunai/PHARE
        ref: fix/ohm-energy-1577
        path: phare
        submodules: recursive
    - name: PHARE's commit
      id: phare
      run: |
        git config --global --add safe.directory '*'
        echo "sha=$(git -C phare rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    # built once per PHARE commit (and build flags: this file)
    - id: built
      uses: actions/cache@v4
      with:
        path: |
          phare/build/pybindlibs/*.so
          phare/build/src/amr/libphare_amr.so
          phare/build/src/initializer/libphare_initializer.so
        key: phare-module-${{ matrix.target }}-${{ steps.phare.outputs.sha }}-${{ hashFiles('.github/workflows/slow.yml') }}
    - name: PHARE's ${{ matrix.target }}
      if: steps.built.outputs.cache-hit != 'true'
      run: |
        set -ex
        printf '1,1,2\n1,Linear,VanLeer,Rusanov,false\n1,WENOZ,None,Rusanov,false\n1,Linear,VanLeer,HLL,false\n1,Linear,VanLeer,HLLD,false\n1,Linear,VanLeer,Rusanov,true\n3,1,6\n' > "$PWD/phare_permutations.txt"
        mkdir -p phare/build && cd phare/build
        cmake .. --fresh -DSAMRAI_ROOT=/usr/local -DCMAKE_BUILD_TYPE=Release \
              -DdevMode=OFF -Dasan=OFF -Dbench=OFF -Dtest=OFF -DPHARE_EXE=OFF \
              -Dphare_configurator=ON \
              -DPHARE_PERMUTATIONS="$GITHUB_WORKSPACE/phare_permutations.txt" \
              -DCMAKE_CXX_FLAGS="-O3 -DPHARE_DIAG_DOUBLES=1"
        cmake --build . -j 4 --target cpp_etc dictator ${{ matrix.target }}
    # the modules' RUNPATH holds these build tree paths: the same workspace path in every job
    - uses: actions/upload-artifact@v4
      with:
        name: phare-${{ matrix.target }}
        path: |
          phare/build/pybindlibs/*.so
          phare/build/src/amr/libphare_amr.so
          phare/build/src/initializer/libphare_initializer.so
        if-no-files-found: error

  phare:
    needs: [plamn_modules, phare_modules]
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # live: no diagnostics, PHARE's snapshots cached per PHARE commit (and comparison scripts):
      #  PHARE runs only when they are missing, plamn compares against them while it runs
      #  (compare_physics.py --live; hybrid cases)
      matrix: # each with its expected tolerance (cases.py) unless print only
        include:
        - { case: beam_1d_long, steps: 2000, ppc: "100", live: true }
        - { case: mhd_shock_1d, steps: 400 }
        - { case: mhd_shock_walls_1d, steps: 1000 }
        - { case: mhd_advance_L1, steps: 8 }
        - { case: mhd_resistive_L1, steps: 8 }
        - { case: mhd_wenoz_L1, steps: 8 }
        - { case: mhd_hll_L1, steps: 8 }
        - { case: mhd_hlld_L1, steps: 8 }
        - { case: mhd_hall_L1, steps: 8 }
        - { case: mhd_hall_hyper_L1, steps: 8 }
        - { case: mhd_hall_hyper_spatial_L1, steps: 8 }
        - { case: mhd_tagged_1d, steps: 40 }
        # 3D, sized for a runner (cases.py tier "gh": ~1 GB per code), within roundoff
        - { case: harris_3d_10, steps: 4, ndim: 3, live: true }
        # 80^3, level 0 only, 80 ppc (41M particles): ~11 GB at its peak, one code at a time
        - { case: harris_3d_80_L0, steps: 4, ndim: 3, live: true }
        # every layout against PHARE master, not only AoSMapped: tiled, the same references
        - { case: beam_1d_long, steps: 2000, ppc: "100", live: true, layout: AoSCMTS }
        - { case: harris_3d_10, steps: 4, ndim: 3, live: true, layout: AoSCMTS }

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - uses: actions/checkout@v4
      with: # the reference while Ohm's energy fix is unmerged upstream: back to PHAREHUB/PHARE
        #  master when it is
        repository: nicolasaunai/PHARE
        ref: fix/ohm-energy-1577
        path: phare
        submodules: recursive
    - uses: actions/download-artifact@v4
      with:
        pattern: plamn-*
        path: plamn
        merge-multiple: true
    - uses: actions/download-artifact@v4
      with:
        pattern: phare-cpp_*
        path: phare/build
        merge-multiple: true
    - name: PHARE's commit
      id: phare
      run: |
        git config --global --add safe.directory '*'
        echo "sha=$(git -C phare rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - if: matrix.live
      uses: actions/cache@v4
      with:
        path: ref_cache
        key: phare-ref-${{ matrix.case }}-${{ matrix.steps }}-${{ matrix.ppc }}-${{ steps.phare.outputs.sha }}-${{ hashFiles('etc/compare/phare/*.py') }}
    - name: PHARE vs plamn ${{ matrix.layout || 'AoSMapped' }}, ${{ matrix.case }}, ${{ matrix.steps }} steps
      env:
        PHARE_DIR: ${{ github.workspace }}/phare
        LADDER_OUT: ${{ github.workspace }}/compare
        LADDER_PPC: ${{ matrix.ppc || '10' }}
        LADDER_REF_CACHE: ${{ github.workspace }}/ref_cache
      run: >-
        python3 etc/compare/phare/compare_physics.py ${{ matrix.live && '--live' || '' }}
        --case ${{ matrix.case }} --ndim ${{ matrix.ndim || 1 }}
        --steps ${{ matrix.steps }} --ref "$PHARE_DIR" --cmp plamn --all-times
        --layout ${{ matrix.layout || 'AoSMapped' }}
        --json compare/${{ matrix.case }}_${{ matrix.layout || 'AoSMapped' }}.json
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phare-compare-${{ matrix.case }}-${{ matrix.layout || 'AoSMapped' }}
        path: |
          compare/*.json
          compare/**/*.log
          compare/**/*.mem.json

  # every comparison run's peak memory in one artifact ("memory": memory.json, memory.md) and
  #  the job summary: measured against cases.py's estimates and tiers, to size cases for runners
  memory:
    needs: [phare]
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: phare-compare-*
        path: compare
    - uses: actions/setup-python@v5 # cases.py needs numpy
      with:
        python-version: "3.12"
    - run: |
        python3 -m pip install --quiet numpy
        python3 etc/compare/phare/memory_table.py compare --json memory.json --md memory.md >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      with:
        name: memory
        path: |
          memory.json
          memory.md
