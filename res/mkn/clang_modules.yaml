# -x res/mkn/clang_modules: clang (>= 20) with C++20 module units (.cppm) as their own file type,
#  for etc/view3d (mathplot: clang only). Its modules are precompiled in import order by
#  res/build_3d_view.py (maiken builds files independently); ccache doesn't cache .pcm builds.
super: base

file:
  - type: cpp:cxx:cc
    archiver: ar -cr
    compiler: clang++ -std=c++20 -fPIC
    linker: clang++
  - type: cppm
    archiver: ar -cr
    compiler: clang++ -std=c++20 -fPIC
    linker: clang++
  - type: c:S
    archiver: ar -cr
    compiler: clang
    linker: clang
