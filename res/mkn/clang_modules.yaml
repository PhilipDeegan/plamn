# -x res/mkn/clang_modules: clang (>= 20) with C++20 module units (.cppm) as their own file type,
#  for etc/view3d (mathplot: clang only). Its modules are precompiled in import order by
#  res/build_3d_view.py (maiken builds files independently); ccache doesn't cache .pcm builds.
super: base

# a versioned clang, e.g. clang-22: name it in compiler/linker below and mask it (and the
#  archiver llvm-ar-22: GNU ar cannot index clang's LTO bitcode)
# compiler:
#   mask:
#     clang++:
#       clang++-22
#     clang:
#       clang-22
file:
  - type: cpp:cxx:cc
    archiver: llvm-ar -cr
    compiler: clang++ -std=c++20 -fPIC
    linker: clang++
  - type: cppm
    archiver: llvm-ar -cr
    compiler: clang++ -std=c++20 -fPIC
    linker: clang++
  - type: c:S
    archiver: llvm-ar -cr
    compiler: clang
    linker: clang
