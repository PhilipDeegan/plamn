
property:
  sys.arch: ${ARCH}

compiler:
  mask:
    g++:
      mpicc
      mpicxx

file:
  - type: cpp:cxx:cc
    archiver: ar -cr
    compiler: mpicxx -std=c++20 -fPIC
    linker: mpicxx

find:
  hdf5:
    inc:
      /usr/include/hdf5/openmpi
      /usr/include/openmpi-${sys.arch}
    lib:
      /usr/lib64/openmpi/lib
      /usr/lib/${sys.arch}-linux-gnu/hdf5/openmpi
