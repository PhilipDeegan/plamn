property:
  cxx_flags: -std=c++20
local:
  repo: /mkn/r
  mod-repo: /mkn/m
remote:
  repo: git@github.com:mkn/
  mod-repo: git@github.com:mkn-mod/
# a versioned clang, e.g. clang++-22: name it in compiler/linker below and mask it as clang++
# compiler:
#   mask:
#     clang++:
#       clang++-22
file:
  - type: cpp:cxx:cc:c:S
    archiver: llvm-ar -cr # clang's (GNU ar cannot index its LTO bitcode), e.g. llvm-ar-22 with clang++-22
    compiler: ccache clang++ ${cxx_flags}
    linker: clang++ -Bmold
