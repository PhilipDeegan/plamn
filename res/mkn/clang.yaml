# clang (22) behind Open MPI's mpicxx: as mpi.yaml (base's HDF5 and host thrust), compiled by clang.
#  Also for clang's analysis modules, eg
#    OPT_VIEWER=/bin/true ./mkn.py --dim 2 -- -m llvm.mca,llvm.opt -x res/mkn/clang
#  (build the modules with gcc first, as their READMEs say: they load into mkn)
super: base

env: |
  OMPI_CXX=clang++-22

compiler:
  mask:
    g++:
      mpicxx

file:
  - type: cpp:cxx:cc
    archiver: ar -cr
    compiler: mpicxx -std=c++20 -fPIC -fsized-deallocation ${cpu.thrust}
    linker: mpicxx -pthread
