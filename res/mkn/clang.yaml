# clang behind Open MPI's mpicxx: as mpi.yaml (base's HDF5 and host thrust), compiled by clang.
#  Also for clang's analysis modules, eg
#    OPT_VIEWER=/bin/true ./mkn.py --dim 2 -- -m llvm.mca,llvm.opt -x res/mkn/clang
#  (build the modules with gcc first, as their READMEs say: they load into mkn)
super: base

env: | # a versioned clang, e.g. OMPI_CXX=clang++-22
  OMPI_CXX=clang++

compiler:
  mask:
    g++:
      mpicxx

file:
  - type: cpp:cxx:cc
    archiver: llvm-ar -cr # clang's (GNU ar cannot index its LTO bitcode), e.g. llvm-ar-22 with clang++-22
    compiler: mpicxx -std=c++20 -fPIC -fsized-deallocation ${cpu.thrust}
    linker: mpicxx -pthread
